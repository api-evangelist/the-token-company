aid: the-token-company
name: The Token Company
description: >-
  The Token Company builds LLM input-compression middleware. A single API call runs
  a prompt, a full chat conversation, or web-search results through their bear
  compression models (bear-2 latest, plus bear-1.2/1.1/1) to strip low-signal tokens
  before the text reaches a language model, cutting cost and latency while preserving
  output quality. It ships drop-in Python and Node.js SDKs that wrap the OpenAI,
  Anthropic, Vercel AI SDK, and OpenRouter clients so existing apps compress
  automatically, plus content-protection (ttc_safe) tags, per-app usage tagging, and a
  zero-data-retention policy. A Y Combinator (W26) company based in San Francisco.
